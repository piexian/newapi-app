name: Issue AI Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
    if: ${{ github.repository == vars.ALLOWED_REPO }}
    env:
      MODELS_ENDPOINT: https://models.github.ai/inference/chat/completions
      TRIAGE_MODEL: openai/gpt-4o-mini

    steps:
      - name: AI classify + Chinese summary
        id: ai
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TITLE:    ${{ github.event.issue.title }}
          BODY:     ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          ALLOWED_LABELS_JSON='["bug","enhancement","question","documentation","chore"]'

          PROMPT="$(printf '%s\n\n%s\n%s\n\n%s\n%s\n\n%s\n%s\n' \
          '你是一个 GitHub Issue 管理助手。
          要求：
          - 不管原文语言是什么，summary_zh 必须是中文，一段话
          - labels 只能从允许集合中选择 0~3 个
          - 仅输出 JSON，不要多余文本
          输出格式：{"summary_zh":"...","labels":["..."]}' \
          "允许集合：" "$ALLOWED_LABELS_JSON" \
          "Issue 标题：" "$TITLE" \
          "Issue 正文：" "$BODY")"

          PAYLOAD="$(jq -n \
            --arg model "$TRIAGE_MODEL" \
            --arg prompt "$PROMPT" \
            '{
              model: $model,
              messages: [
                {role:"system", content:"Return only valid JSON. No markdown."},
                {role:"user", content:$prompt}
              ],
              temperature: 0.2
            }')"

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          if HTTP_STATUS="$(curl -sS \
              --connect-timeout 15 \
              --max-time 120 \
              --retry 2 \
              --retry-all-errors \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              "$MODELS_ENDPOINT" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")"; then
            CURL_EXIT_CODE=0
          else
            CURL_EXIT_CODE=$?
          fi

          if [[ "$CURL_EXIT_CODE" -ne 0 ]]; then
            echo "::error::GitHub Models request failed with curl exit code ${CURL_EXIT_CODE}."
            exit 1
          fi

          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]] || \
            ! jq -e '.choices[0].message.content | type == "string"' "$RESPONSE_FILE" >/dev/null 2>&1; then
            echo "::error::GitHub Models did not return a compatible chat completion (HTTP ${HTTP_STATUS})."
            head -c 1000 "$RESPONSE_FILE" || true
            exit 1
          fi

          CONTENT="$(jq -r '.choices[0].message.content' "$RESPONSE_FILE")"
          PARSED_CONTENT="$(jq -cn --arg content "$CONTENT" '
            ($content | try fromjson catch null) //
            ($content | try (capture("(?s)```(?:json)?\\s*(?<json>\\{.*\\})\\s*```").json | fromjson) catch null)
          ')"

          if ! jq -e 'type == "object"' <<< "$PARSED_CONTENT" >/dev/null; then
            echo "::error::Model response content is not a JSON object."
            exit 1
          fi

          SUMMARY="$(jq -r 'if (.summary_zh | type) == "string" then .summary_zh else empty end' <<< "$PARSED_CONTENT")"
          RAW_LABELS="$(jq -c '
            (.labels // []) |
            if type == "array" then map(select(type == "string"))
            elif type == "string" then [.]
            else []
            end
          ' <<< "$PARSED_CONTENT")"
          LABELS="$(jq -cn \
            --argjson labels "$RAW_LABELS" \
            --argjson allowed "$ALLOWED_LABELS_JSON" \
            '$labels | map(select(. as $label | $allowed | index($label))) | unique | .[:3]')"

          [ -n "$SUMMARY" ] || exit 1

          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
            echo "labels=$LABELS"
          } >> "$GITHUB_OUTPUT"

      - name: Apply labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO:  ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS_JSON: ${{ steps.ai.outputs.labels }}
        run: |
          set -euo pipefail

          tmp="$(mktemp)"
          gh label list --json name --limit 200 | jq -r '.[].name' > "$tmp"

          echo "$LABELS_JSON" | jq -r '.[]' | while read -r label; do
            [ -n "$label" ] || continue

            if ! grep -Fxq "$label" "$tmp"; then
              gh label create "$label" --color ededed --description auto >/dev/null
              echo "$label" >> "$tmp"
            fi

            gh issue edit "$ISSUE_NUMBER" --add-label "$label" >/dev/null
          done

      - name: Comment summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO:  ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.ai.outputs.summary }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "🤖 **摘要（中文）**\n\n$SUMMARY"
