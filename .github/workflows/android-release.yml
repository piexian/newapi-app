name: Android Release APK

# 触发：打 v* tag 时自动构建并发布 Release；workflow_dispatch 提供手动入口（首次调试/补发用，可删）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  build-apk:
    name: Build signed APK (EAS local)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 在仓库 Settings → Secrets and variables → Actions 配置 EXPO_TOKEN（expo.dev 的 Access Token）
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # 让 eas --local 把产物写到 ./dist
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17 (Gradle/RN 要求 17，勿用 23)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform / build-tools / NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          # NDK 版本由 Expo/RN 决定；--local 构建若缺对应版本会报具体缺失，可按日志补齐
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --location=global eas-cli

      - name: Verify EAS auth
        run: eas whoami

      - name: Build APK locally with EAS-managed signing
        # --local：在本 runner 构建（不占 EAS 云端队列），但签名 keystore 自动从 EAS 拉取，
        # 因此产物与此前 EAS 云端发包签名一致，可直接覆盖安装。
        # profile=preview 即 buildType=apk（见 eas.json），适合侧载分发。
        run: eas build --platform android --profile preview --local --non-interactive --output ./dist/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
