name: Android Release APK

# 触发：打 v* tag 时自动构建并发布 Release；workflow_dispatch 提供手动入口（首次调试/补发用，可删）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  build-apk:
    name: Build signed ABI-split APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17 (Gradle/RN 要求 17，勿用 23)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform / build-tools / NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          # NDK 版本与本地验证过的成功构建保持一致
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild android/ (应用 config plugins，含 ABI 拆分)
        run: npx expo prebuild --platform android --clean

      - name: Decode release keystore from secrets
        # ANDROID_KEYSTORE_BASE64 = release.keystore 的 base64（见仓库 Secrets 配置说明）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Build signed ABI-split APKs
        # injected signing：不改 build.gradle，AGP 生成 externalOverride 签名配置；
        # store.file 必须绝对路径（相对路径会相对 Gradle daemon 工作目录解析）。
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "== $apk =="
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -E "certificate SHA-256|Signer"
          done

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/
          ls -la dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
